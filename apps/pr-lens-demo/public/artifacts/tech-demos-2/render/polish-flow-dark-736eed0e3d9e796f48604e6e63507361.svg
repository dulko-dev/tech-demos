<title>Detect then rewrite</title>
<desc>Adds a self-contained demo that asks whether Impeccable improves AI-default UI. BEFORE is a typical generated landing (63 detector findings). AFTER is the same SyncFlow page after the Impeccable command chain (0 findings). A Vite shell toggles live iframes and shows the raw CLI counts.</desc>
