<title>Client hook path</title>
<desc>Adds the Hooks proposal (useState, useEffect, useContext, and friends) behind enableHooks. Public APIs land in react, the hook list lives on a fiber, the server renderer gets a matching dispatcher, and a new eslint-plugin-react-hooks package teaches the Rules of Hooks. Class components stay the default path.</desc>
